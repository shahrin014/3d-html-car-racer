<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050a12" />
    <meta
      name="description"
      content="Orange-loop circuit racer: three laps on a generated toy track with loops, banks, and boost strips."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orange Loop" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Orange Loop — 3D Circuit Racer</title>
  </head>
  <body data-screen="countdown">
    <main id="app" class="stage"></main>
    <div class="vignette" aria-hidden="true"></div>
    <div id="hit-flash" class="hit-flash" aria-hidden="true"></div>

    <header class="hud" aria-label="Race status">
      <div class="hud__group">
        <div class="stat">
          <span class="stat__label">Time</span>
          <span class="stat__value" id="time">00:00.0</span>
        </div>
        <div class="stat">
          <span class="stat__label">Lap</span>
          <span class="stat__value" id="lap">1 / 3</span>
        </div>
        <div class="stat stat--best">
          <span class="stat__label">Best</span>
          <span class="stat__value" id="best">--:--.-</span>
        </div>
      </div>
      <div class="hud__group hud__group--end">
        <div class="stat">
          <span class="stat__label">Speed</span>
          <span class="stat__value" id="speed">0</span>
        </div>
        <div class="damage" id="damage" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Damage">
          <span class="damage__fill" id="damage-fill"></span>
        </div>
        <button type="button" class="icon-button" id="camera" aria-label="Switch camera">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 7h3l1.5-2h7L17 7h3v11H4z" />
            <circle cx="12" cy="12.5" r="3.2" />
          </svg>
        </button>
        <button type="button" class="icon-button" id="pause" aria-label="Pause race">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="7" y="5" width="3.5" height="14" rx="1.2" />
            <rect x="13.5" y="5" width="3.5" height="14" rx="1.2" />
          </svg>
        </button>
      </div>
    </header>

    <div class="controls" aria-label="Driving controls">
      <button type="button" class="control control--brake" id="brake" aria-label="Brake">
        <span>Brake</span>
      </button>
    </div>

    <section class="overlay overlay--soft" data-overlay="paused" role="dialog" aria-modal="true" aria-labelledby="paused-title">
      <div class="panel">
        <p class="eyebrow">Engine idle</p>
        <h2 class="title title--small" id="paused-title">Paused</h2>
        <p class="lede">Your lap is waiting.</p>
        <div class="button-row">
          <button type="button" class="button button--primary" data-action="resume">Resume</button>
          <button type="button" class="button button--ghost" data-action="restart">Restart</button>
          <button type="button" class="button button--quiet" data-action="menu">Main menu</button>
        </div>
      </div>
    </section>

    <section class="overlay" data-overlay="finished" role="dialog" aria-modal="true" aria-labelledby="over-title">
      <div class="panel">
        <p class="eyebrow">Race complete</p>
        <h2 class="title title--small" id="over-title">Finished</h2>
        <p class="badge" id="new-best" hidden>New personal best</p>
        <dl class="results">
          <div class="result"><dt>Total</dt><dd id="final-time">00:00.0</dd></div>
          <div class="result"><dt>Damage</dt><dd id="final-damage">0%</dd></div>
          <div class="result result--wide">
            <dt>Placing</dt><dd id="final-placing">1st of 1</dd>
          </div>
        </dl>
        <div class="button-row">
          <button type="button" class="button button--primary" data-action="restart">Race again</button>
          <button type="button" class="button button--quiet" data-action="menu">Main menu</button>
        </div>
      </div>
    </section>

    <div class="rotate" id="rotate" role="dialog" aria-label="Rotate device">
      <div class="panel">
        <h2 class="title title--small">Rotate to landscape</h2>
        <p class="lede">Orange Loop is played sideways. Turn your phone.</p>
      </div>
    </div>

    <noscript>
      <p class="noscript">Orange Loop needs JavaScript and WebGL.</p>
    </noscript>

    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
