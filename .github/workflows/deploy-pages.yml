name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Production publishes only from main. Manual runs on other refs are
    # intentionally a no-op rather than an accidental deployment.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Verify GitHub Pages is configured for Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /tmp/pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$status" != "200" ]; then
            echo "::error::GitHub Pages is not enabled. Open Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi
          build_type=$(jq -r '.build_type // empty' /tmp/pages.json)
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages source is '${build_type:-unknown}'. Open Settings → Pages, set Source to 'GitHub Actions', then re-run this workflow."
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
