name: Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Pull requests only: pushes to main are validated by the deployment workflow,
# and this workflow never deploys or needs a writable token.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build (enforces the gzip budget)
        run: npm run check

      - name: Publish unit test summary
        if: always()
        run: node build/test-report-summary.ts

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: test-results/vitest-junit.xml
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundles
        run: npm run build

      - name: Run Playwright smoke tests
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
