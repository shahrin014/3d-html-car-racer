<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#050a12" />
    <meta
      name="description"
      content="Preview the Neon Racer circuit before you start the race."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Neon Racer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>Track Preview — Neon Racer</title>
  </head>
  <body data-screen="preview">
    <main id="app" class="stage">
      <div class="preview__canvas" id="preview-canvas"></div>
    </main>

    <div class="preview__hud" aria-label="Track preview controls">
      <div class="preview__top">
        <header class="preview__bar">
          <div class="preview__heading">
            <p class="eyebrow">Track preview</p>
            <h1 class="title title--small">Neon Racer</h1>
          </div>
          <button type="button" class="button button--ghost preview__back" id="preview-back">
            Back to menu
          </button>
        </header>

        <section class="preview__requirements" aria-labelledby="preview-requirements-title">
          <div class="preview__requirements-head">
            <p class="eyebrow" id="preview-requirements-title">Required segments</p>
            <button
              type="button"
              class="button button--ghost preview__randomize"
              id="preview-randomize-requirements"
            >
              Randomize
            </button>
          </div>
          <p
            class="preview__requirements-note"
            id="preview-requirements-note"
            aria-live="polite"
          >
            Select segments the track must contain.
          </p>
          <div id="preview-segments"></div>
        </section>
      </div>

      <div class="preview__actions">
        <p class="preview__seed" id="preview-seed" aria-live="polite">--</p>
        <div class="preview__buttons">
          <button type="button" class="button button--ghost" id="preview-regenerate">
            Regenerate track
          </button>
          <button type="button" class="button button--primary" id="preview-start">
            Start race
          </button>
        </div>
      </div>
    </div>

    <div class="preview__loading" id="preview-loading" role="status">
      <span class="preview__spinner" aria-hidden="true"></span>
      <span>Building circuit…</span>
    </div>

    <div class="rotate" id="rotate" role="dialog" aria-label="Rotate device">
      <div class="panel">
        <h2 class="title title--small">Rotate to landscape</h2>
        <p class="lede">Neon Racer is played sideways. Turn your phone.</p>
      </div>
    </div>

    <noscript>
      <p class="noscript">Neon Racer needs JavaScript and WebGL.</p>
    </noscript>

    <script type="module" src="/src/trackPreview.ts"></script>
  </body>
</html>
